name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Light dependencies only: the tests never need PyTorch, Ultralytics, picamera2 or gpiozero.
      - run: pip install opencv-python-headless numpy PyYAML Flask pytest gpiozero
      - run: python -m pytest -q
      - run: bash -n deploy/setup_pi.sh
      - run: python -c "import json; [json.load(open(f)) for f in ('notebooks/demo_colab.ipynb', 'notebooks/train_colab.ipynb')]"
