<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Wiring diagram: Raspberry Pi, relay, ultrasonic repeller, buzzer, camera and screen</title>
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#111">Wiring: AI Dog Detection &amp; Repellent System</text>

  <!-- ===== Raspberry Pi ===== -->
  <rect x="30" y="60" width="300" height="560" rx="14" fill="#1d6b3a" stroke="#0f4024" stroke-width="2"/>
  <text x="180" y="88" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">Raspberry Pi 4 / 5</text>

  <!-- 40-pin header inset (pin 1 at the top-left) -->
  <rect x="52" y="104" width="64" height="276" rx="5" fill="#0f2f1c" stroke="#9bc7a8"/>
  <text x="84" y="398" font-size="11" text-anchor="middle" fill="#d6eadc">40-pin header</text>
  <text x="84" y="412" font-size="10" text-anchor="middle" fill="#d6eadc">(pin 1 = square pad)</text>
  <g fill="#7f8c86">
    <!-- 20 rows x 2 pins, rows 13 px apart -->
    <circle cx="72" cy="117" r="4.5"/><circle cx="96" cy="117" r="4.5"/>
    <circle cx="72" cy="130" r="4.5"/><circle cx="96" cy="130" r="4.5"/>
    <circle cx="72" cy="143" r="4.5"/><circle cx="96" cy="143" r="4.5"/>
    <circle cx="72" cy="156" r="4.5"/><circle cx="96" cy="156" r="4.5"/>
    <circle cx="72" cy="169" r="4.5"/><circle cx="96" cy="169" r="4.5"/>
    <circle cx="72" cy="182" r="4.5"/><circle cx="96" cy="182" r="4.5"/>
    <circle cx="72" cy="195" r="4.5"/><circle cx="96" cy="195" r="4.5"/>
    <circle cx="72" cy="208" r="4.5"/><circle cx="96" cy="208" r="4.5"/>
    <circle cx="72" cy="221" r="4.5"/><circle cx="96" cy="221" r="4.5"/>
    <circle cx="72" cy="234" r="4.5"/><circle cx="96" cy="234" r="4.5"/>
    <circle cx="72" cy="247" r="4.5"/><circle cx="96" cy="247" r="4.5"/>
    <circle cx="72" cy="260" r="4.5"/><circle cx="96" cy="260" r="4.5"/>
    <circle cx="72" cy="273" r="4.5"/><circle cx="96" cy="273" r="4.5"/>
    <circle cx="72" cy="286" r="4.5"/><circle cx="96" cy="286" r="4.5"/>
    <circle cx="72" cy="299" r="4.5"/><circle cx="96" cy="299" r="4.5"/>
    <circle cx="72" cy="312" r="4.5"/><circle cx="96" cy="312" r="4.5"/>
    <circle cx="72" cy="325" r="4.5"/><circle cx="96" cy="325" r="4.5"/>
    <circle cx="72" cy="338" r="4.5"/><circle cx="96" cy="338" r="4.5"/>
    <circle cx="72" cy="351" r="4.5"/><circle cx="96" cy="351" r="4.5"/>
    <circle cx="72" cy="364" r="4.5"/><circle cx="96" cy="364" r="4.5"/>
  </g>
  <!-- used pins, highlighted -->
  <rect x="67" y="112" width="10" height="10" fill="#f39c12" stroke="#fff"/>            <!-- pin 1: 3.3V -->
  <circle cx="96" cy="117" r="5.5" fill="#e74c3c" stroke="#fff"/>                         <!-- pin 2: 5V -->
  <circle cx="96" cy="143" r="5.5" fill="#111" stroke="#fff"/>                            <!-- pin 6: GND -->
  <circle cx="72" cy="169" r="5.5" fill="#111" stroke="#fff"/>                            <!-- pin 9: GND -->
  <circle cx="72" cy="182" r="5.5" fill="#27ae60" stroke="#fff"/>                         <!-- pin 11: GPIO17 -->
  <circle cx="72" cy="195" r="5.5" fill="#2e86de" stroke="#fff"/>                         <!-- pin 13: GPIO27 -->
  <g font-size="10" fill="#fff">
    <text x="42" y="121" text-anchor="end">1</text><text x="110" y="121">2</text>
    <text x="110" y="147">6</text><text x="42" y="173" text-anchor="end">9</text>
    <text x="42" y="186" text-anchor="end">11</text><text x="42" y="199" text-anchor="end">13</text>
  </g>

  <!-- terminal labels on the Pi edge (logical order, see the inset for the physical position) -->
  <g font-size="14" fill="#fff" text-anchor="end">
    <text x="318" y="155">5V · pin 2</text>
    <text x="318" y="205">GND · pin 6</text>
    <text x="318" y="255">GPIO17 · pin 11</text>
    <text x="318" y="395">3.3V · pin 1</text>
    <text x="318" y="445">GND · pin 9</text>
    <text x="318" y="495">GPIO27 · pin 13</text>
    <text x="318" y="548">CSI camera port</text>
    <text x="318" y="588">micro-HDMI 0 + USB</text>
  </g>
  <text x="50" y="606" font-size="12" fill="#d6eadc">Power: USB-C, official 5 V 5 A (Pi 5) / 5 V 3 A (Pi 4)</text>

  <!-- ===== Wires to the relay ===== -->
  <g stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="330" y1="150" x2="470" y2="150" stroke="#e74c3c"/>
    <line x1="330" y1="200" x2="470" y2="200" stroke="#111"/>
    <line x1="330" y1="250" x2="470" y2="250" stroke="#27ae60"/>
    <!-- buzzer -->
    <line x1="330" y1="390" x2="470" y2="390" stroke="#f39c12"/>
    <line x1="330" y1="440" x2="470" y2="440" stroke="#111"/>
    <line x1="330" y1="490" x2="470" y2="490" stroke="#2e86de"/>
  </g>
  <rect x="330" y="536" width="140" height="16" fill="#c9ccd1" stroke="#8a8f96"/>           <!-- camera ribbon -->
  <line x1="330" y1="584" x2="760" y2="584" stroke="#555" stroke-width="5" stroke-dasharray="1 0"/>
  <text x="560" y="576" font-size="12" text-anchor="middle" fill="#444">HDMI + USB power cable</text>

  <!-- ===== Relay module ===== -->
  <rect x="470" y="86" width="180" height="204" rx="10" fill="#1f4e9c" stroke="#123266" stroke-width="2"/>
  <text x="560" y="108" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">Relay module</text>
  <text x="560" y="125" font-size="11" text-anchor="middle" fill="#cfe0ff">1-channel, opto-isolated</text>
  <g font-size="13" fill="#fff">
    <text x="480" y="155">VCC</text><text x="480" y="205">GND</text><text x="480" y="255">IN</text>
    <text x="640" y="185" text-anchor="end">COM</text><text x="640" y="230" text-anchor="end">NO</text>
    <text x="640" y="275" text-anchor="end" fill="#9fb3d6">NC (unused)</text>
  </g>

  <!-- ===== 12 V adapter and repeller ===== -->
  <rect x="760" y="60" width="210" height="80" rx="10" fill="#444" stroke="#222" stroke-width="2"/>
  <text x="865" y="92" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">12 V DC adapter</text>
  <text x="865" y="112" font-size="11" text-anchor="middle" fill="#ddd">separate supply, never from the Pi</text>
  <text x="808" y="134" font-size="13" fill="#fff">+</text><text x="928" y="134" font-size="13" fill="#fff">−</text>

  <rect x="760" y="260" width="210" height="100" rx="10" fill="#7d3c98" stroke="#4a235a" stroke-width="2"/>
  <text x="865" y="300" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">Ultrasonic repeller</text>
  <text x="865" y="320" font-size="11" text-anchor="middle" fill="#ead6f2">12 V module, set to ≥ 23 kHz</text>
  <text x="808" y="278" font-size="13" fill="#fff">+</text><text x="928" y="278" font-size="13" fill="#fff">−</text>

  <g stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="650,180 800,180 800,140" stroke="#c0392b"/>
    <polyline points="650,225 800,225 800,260" stroke="#c0392b"/>
    <line x1="920" y1="140" x2="920" y2="260" stroke="#111"/>
  </g>
  <text x="725" y="173" font-size="12" text-anchor="middle" fill="#c0392b">+12 V</text>
  <text x="725" y="218" font-size="12" text-anchor="middle" fill="#c0392b">switched +12 V</text>
  <text x="932" y="205" font-size="12" fill="#111">−</text>

  <!-- ===== Buzzer ===== -->
  <rect x="470" y="360" width="180" height="150" rx="10" fill="#2c3e50" stroke="#1b2631" stroke-width="2"/>
  <text x="575" y="420" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">Active buzzer</text>
  <text x="575" y="470" font-size="11" text-anchor="middle" fill="#cdd6df">module (3 pins)</text>
  <g font-size="13" fill="#fff">
    <text x="480" y="395">VCC</text><text x="480" y="445">GND</text><text x="480" y="495">I/O</text>
  </g>

  <!-- ===== Camera and screen ===== -->
  <rect x="470" y="526" width="180" height="36" rx="8" fill="#555" stroke="#333"/>
  <text x="560" y="549" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">Pi Camera (NoIR for night)</text>
  <rect x="760" y="555" width="210" height="58" rx="8" fill="#555" stroke="#333"/>
  <text x="865" y="580" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">7" HDMI screen</text>
  <text x="865" y="598" font-size="11" text-anchor="middle" fill="#ddd">power from a Pi USB port</text>

  <!-- ===== Notes ===== -->
  <rect x="680" y="395" width="290" height="130" rx="8" fill="#fff8e1" stroke="#f0c36d"/>
  <g font-size="12" fill="#5d4300">
    <text x="692" y="417" font-weight="700">Safety</text>
    <text x="692" y="437">• Relay wired COM → NO: the repeller is</text>
    <text x="692" y="453">  OFF whenever the Pi is off or booting.</text>
    <text x="692" y="473">• 12 V never touches any Pi pin.</text>
    <text x="692" y="493">• Wire everything with ALL power unplugged.</text>
    <text x="692" y="513">• Pi 5: use the 22-pin camera cable.</text>
  </g>
  <text x="500" y="660" font-size="12" text-anchor="middle" fill="#555">Pin numbers are physical header positions; GPIO numbers are what config.yaml uses (repeller.pin: 17, buzzer.pin: 27).</text>
  <text x="500" y="680" font-size="12" text-anchor="middle" fill="#555">Wire colours are only a suggestion. Red = +, black = GND, green / blue = signals.</text>
</svg>
